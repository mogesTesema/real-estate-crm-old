name: Sync Company Repo to Mirror

on:
  schedule:
    - cron: '*/30 * * * *' # Syncs automatically every 30 minutes
  workflow_dispatch: # Adds a button in GitHub to trigger a sync manually

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mirror Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.COMPANY_PAT }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Sync Action"
          git config --global user.email "action@github.com"

      - name: Pull and Push
        run: |
          # Add the company repository as a remote 
          git remote add company https://${{ secrets.COMPANY_PAT }}@github.com/simbatechplc/real-estate-crm.git
          
          # Fetch latest changes from the company repo
          git fetch company main
          
          # Merge changes into your local mirror's main branch
          git merge company/main --no-edit --allow-unrelated-histories
          
          # Push the updated code to your personal private repo (which triggers Vercel)
          git push origin main# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
